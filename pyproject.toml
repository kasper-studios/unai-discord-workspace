[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unai-discord-workspace"
version = "1.0.0"
description = "Native Discord workspace package for UnAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
    "PyNaCl>=1.5.0",
    "edge-tts>=7.0.0",
    "discord.py-self>=2.1.0",
]
